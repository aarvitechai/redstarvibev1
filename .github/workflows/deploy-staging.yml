name: Deploy staging
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/web:${{ github.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Roll out, migrate and smoke test
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: SHA
          script: |
            cd /srv/redstarvibe && git fetch origin && git checkout "$SHA"
            IMAGE_TAG="$SHA" docker compose --env-file .env -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.prod.yml up -d
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/nginx-health && curl -fsS http://127.0.0.1:8080/api/v1/auth/providers && break; sleep 5; done
      - name: k6 baseline
        uses: grafana/k6-action@v0.3.1
        with: { filename: apps/backend/tests/load/feed.js }
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
