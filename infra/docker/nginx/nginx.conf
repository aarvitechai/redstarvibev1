worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;
  client_max_body_size 1m;

  # Docker's DNS: re-resolve so a restarted container does not leave a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
  # Trust the forwarded scheme only from Cloudflare tunnels and proxies in front of this gateway.
  map $http_x_forwarded_proto $proxy_scheme { default $http_x_forwarded_proto; '' $scheme; }

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $proxy_scheme;
  proxy_set_header X-Forwarded-Host $http_host;

  server {
    listen 80;

    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location = /metrics { return 404; }

    set $api http://api:8000;
    set $ws http://ws:8000;
    set $mcp http://mcp:8001;
    set $web http://web:3000;
    set $storage http://objectstore:9000;

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass $api;
      proxy_read_timeout 90s;
    }
    location /.well-known/oauth-authorization-server { proxy_pass $api; }

    location = /ws {
      proxy_pass $ws;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /mcp {
      proxy_pass $mcp;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
    location /.well-known/oauth-protected-resource { proxy_pass $mcp; }

    # Same origin object storage. Bucket and Host stay intact so presigned signatures remain valid.
    location /rsv-raw/ {
      limit_except PUT { deny all; }
      client_max_body_size 600m;
      proxy_request_buffering off;
      proxy_pass $storage;
    }
    location /rsv-public/ {
      limit_except GET HEAD { deny all; }
      proxy_pass $storage;
      proxy_hide_header X-Amz-Request-Id;
      proxy_hide_header X-Amz-Id-2;
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location / {
      proxy_pass $web;
      proxy_read_timeout 60s;
    }
  }
}
