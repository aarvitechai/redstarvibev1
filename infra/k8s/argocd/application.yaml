apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redstarvibe
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/redstarvibe
    path: infra/k8s/helm/redstarvibe
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: redstarvibe
  syncPolicy:
    automated: {prune: true, selfHeal: true}
