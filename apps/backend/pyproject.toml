[project]
name = "redstarvibe-backend"
version = "1.0.0"
description = "RedStarVibe modular monolith: REST API, realtime gateway, MCP server and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "authlib>=1.3",
  "httpx>=0.27",
  "redis>=5.0",
  "celery>=5.4",
  "boto3>=1.34",
  "pillow>=11.3",
  "pyotp>=2.9",
  "cryptography>=42",
  "anthropic>=0.60",
  "livekit-api>=0.7",
  "mcp>=1.9",
  "pywebpush>=2.0",
  "aiosmtplib>=3.0",
  "structlog>=24.1",
  "orjson>=3.10",
  "prometheus-client>=0.20",
  "sentry-sdk>=2.5",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "pgvector>=0.3",
  "numpy>=1.26",
]

[project.optional-dependencies]
ai = [
  "open-clip-torch>=2.24",
  "sentence-transformers>=3.0",
  "faster-whisper>=1.0",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "S101", "S311", "S105", "S106", "UP047", "UP046", "ASYNC230", "ASYNC240", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/", "scripts/"]

[[tool.mypy.overrides]]
module = "app.workers.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
